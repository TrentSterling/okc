name: Deploy Prairie Prism to GitHub Pages

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install pinned map compiler
        run: python -m pip install --requirement requirements-build.txt

      - name: Install pinned shader source and native validation runtime
        run: |
          npm ci --ignore-scripts
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgles2 libegl-mesa0 libgl1-mesa-dri

      - name: Build site from saved source inputs
        run: npm run build

      - name: Validate source, build safety, geometry, driving and sunset optics
        run: npm run check

      - name: Compile the actual production shader variants
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          node scripts/visual/prepare-sunset-diagnostics.mjs --output "$RUNNER_TEMP/okc-sunset-shaders"
          python scripts/visual/check-sunset-gles.py --input "$RUNNER_TEMP/okc-sunset-shaders" --output "$RUNNER_TEMP/sunset-shader-validation" --compile-only
          node scripts/check-depth-offsets.mjs --output "$RUNNER_TEMP/okc-depth-offsets.json"
          python scripts/visual/check-depth-offsets-gles.py --state "$RUNNER_TEMP/okc-depth-offsets.json" --output "$RUNNER_TEMP/sunset-shader-validation/depth-offsets-v06.json"

      - name: Preserve shader validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunset-shaders-${{ github.sha }}
          path: ${{ runner.temp }}/sunset-shader-validation/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve the verified deployment output
        uses: actions/upload-artifact@v4
        with:
          name: prairie-prism-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the verified deployment output
        uses: actions/download-artifact@v4
        with:
          name: prairie-prism-${{ github.sha }}
          path: dist/

      - name: Checkout publishing branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .pages-publish

      - name: Publish complete static build
        run: |
          rsync -a --delete --exclude='.git' dist/ .pages-publish/
          git -C .pages-publish config user.name 'github-actions[bot]'
          git -C .pages-publish config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .pages-publish add --all
          if ! git -C .pages-publish diff --cached --quiet; then
            git -C .pages-publish commit -m "Publish Prairie Prism from ${GITHUB_SHA}"
            git -C .pages-publish push origin HEAD:gh-pages
          fi
          echo "PAGES_COMMIT=$(git -C .pages-publish rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Request native Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '{status: .status, url: .url}'
          for attempt in {1..36}; do
            read -r status commit <<< "$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '[.status, .commit] | @tsv')"
            if [ "$commit" = "$PAGES_COMMIT" ]; then
              if [ "$status" = 'built' ]; then
                echo "GitHub Pages published ${PAGES_COMMIT}"
                exit 0
              fi
              if [ "$status" = 'errored' ]; then
                echo 'GitHub Pages build failed'
                exit 1
              fi
            fi
            sleep 5
          done
          echo 'Timed out waiting for the requested Pages revision'
          exit 1

      - name: Verify every published runtime module and capture download
        env:
          SITE_URL: https://tront.xyz/okc/
        run: node scripts/verify-published.mjs
