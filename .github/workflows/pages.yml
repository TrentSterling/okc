name: Deploy Prairie Prism to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build original capture downloads
        run: python3 scripts/build-downloads.py

      - name: Check static site and project-relative paths
        run: node scripts/check-static.mjs

      - name: Check tower surface ownership
        run: node scripts/check-tower-surfaces.mjs

      - name: Check compiled world surface ownership
        run: |
          if [ -f scripts/check-world-surfaces.mjs ]; then
            node scripts/check-world-surfaces.mjs
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
